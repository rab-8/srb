<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web Multi Player html">
    <meta name="title" content="Multi Player">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/css/custom-scrollbar.css">
    <link rel="icon" type="image/x-icon" href="https://rab-8.github.io/images/calculator.png">
    <link rel="stylesheet" href="https://rab-8.github.io/css/ration-bokeya-calculator.css">
<title>বকেয়া ক্যালকুলেটর</title>
</head>

<body>
<main class="app">

  <h1>🧮 বকেয়া রেশন ক্যালকুলেটর</h1>

  <section class="controls">
    <div class="control">
      <label for="days">দিন</label>
      <input id="days" type="number" min="0" step="1" value="30">
    </div>

    <div class="control">
      <label for="units">ইউনিট সংখ্যা</label>
      <input id="units" type="number" min="0" step="0.5" value="1">
    </div>

    <div class="control">
      <label for="unitType">একক</label>
      <select id="unitType">
        <option value="single">একক রেশন</option>
        <option value="family">পারিবারিক রেশন</option>
      </select>
    </div>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>পণ্যের নাম</th>
          <th>পরিমাণ</th>
          <th>একক মূল্য (টাকা)</th>
          <th>মোট টাকা (টাকা)</th>
        </tr>
      </thead>
      <tbody id="items"></tbody>
    </table>
  </div>

  <div class="total">
    <span>মোট টাকার পরিমাণ =</span>
    <span class="total-value" id="grandTotal">৳ ০</span>
  </div>

  <p class="hint">
    পরিমাণ স্বয়ংক্রিয়ভাবে হিসাব হয়; এই ঘর সম্পাদনা করা যায় না।
    একক মূল্য পরিবর্তন করলে মোট টাকাও আপডেট হবে।
  </p>

</main>
<script src="https://rab-8.github.io/js/ration-bokeya-calculator.js"></script>
</body>
</html>
