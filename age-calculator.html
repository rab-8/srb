<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web Multi Player html">
    <meta name="title" content="Multi Player">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/css/custom-scrollbar.css">
    <link rel="icon" type="image/x-icon" href="https://rab-8.github.io/images/calculator.png">
    <title> Age Calculator </title>
    <link rel="stylesheet" href="https://masumbillah6778.github.io/master-multi-media/assets/css/main-page-v2.css">
    <link rel="stylesheet" href="https://masumbillah6778.github.io/master-multi-media/assets/css/main-page-media-screen.css">
  </head>
  
  <body>
    <div id="mai-page-fr" class="slide-box">
      <div class="calculator">
        <form>
          <div class="calculator-box">
            <div class="enter">
              <h1> নিচে আপনার জন্ম তারিখ দিন ইংরেজিতে </h1>
            </div>

            <div class="block">
              <p class="title"> দিন </p>
              <input type="text" name="date" id="date" placeholder="দিন" required="required" minlength="1" maxlength="2" />
            </div>

            <div class="block">
              <p class="title"> মাস </p>
              <input type="text" name="month" id="month" placeholder="মাস" required="required" minlength="1" maxlength="2" />
            </div>

            <div class="block">
              <p class="title"> সাল </p>
              <input type="text" name="year" id="year" placeholder="সাল" required="required" minlength="4" maxlength="4" />
            </div>
          </div>

          <div class="calculator-box">
            <div class="enter">
              <input type="button" name="submit" value="বয়স দেখুন" onclick="age()" />
            </div>
          </div>
          <div id="age"></div>
        </form>
      </div>
    </div>

    <script src="https://masumbillah6778.github.io/multi-player/assets/js/hover-auto-play.js"></script>
    <script src="https://masumbillah6778.github.io/js/toggle-dark-light.js"></script>
    <script src="/1st/assets/js/index-password.js"></script>
    <script src="https://masumbillah6778.github.io/master-multi-media/assets/js/age-calculator-v1.js"></script>

  </body>
</html>
